[package]
name = "wordcraft-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft iPadOS platform layer and C FFI bridge"

[lints.rust]
unsafe_code = "allow"

[lib]
name = "wordcraft"
crate-type = ["staticlib", "rlib"]

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-ui-egui = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-geom = { workspace = true }
craft = { workspace = true, features = ["ui", "window", "platform", "settings"] }
egui = { workspace = true }
egui-wgpu = "0.37"
pollster = "1"
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
craft = { workspace = true, features = ["ui", "ui-app"] }
