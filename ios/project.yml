name: WordCraft
options:
  bundleIdPrefix: com.wordcraft
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  WordCraft:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: WordCraft
        PRODUCT_BUNDLE_IDENTIFIER: com.wordcraft.wordcraft-ios
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/WordCraft-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../target/aarch64-apple-ios/release
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/../crates/wordcraft-ios/include
        OTHER_LDFLAGS:
          - $(inherited)
          - -ObjC
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: GameController.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Security.framework
      - sdk: AudioToolbox.framework
      - file: ../target/aarch64-apple-ios/release/libwordcraft.a
