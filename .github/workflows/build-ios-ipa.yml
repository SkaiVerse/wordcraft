name: Build iPadOS Unsigned IPA

on:
  push:
    branches: [main, ipad-port]
  pull_request:
    branches: [main, ipad-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-ipa-${{ runner.os }}

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build Unsigned IPA
        run: |
          chmod +x ios/build_unsigned_ipa.sh
          ./ios/build_unsigned_ipa.sh

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-unsigned-ipa
          path: build/WordCraft-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-ios-build-logs
          path: build/build-logs.zip
          if-no-files-found: ignore
          retention-days: 14
